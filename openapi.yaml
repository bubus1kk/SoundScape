openapi: 3.0.3
info:
  title: SoundScape — серверные HTTP-контракты
  version: 1.2.0
  description: |
    OpenAPI 3.0.3 — HTTP-контракт серверной части SoundScape, актуализированный после практической работы № 9.

    Статус: основные операции реализованы в локальном Supabase (PostgreSQL/PostGIS,
    Auth, Storage, PostgREST RPC, Edge Functions). Локальные интеграционные тесты
    подтвердили 52 сценария, но это не означает исчерпывающего покрытия всех операций.
    Поиск и получение аудиоисточника Audius проверены живыми запросами.
    Успешная генерация через GigaChat пока не подтверждена; облачного развёртывания нет.

    Протокол RPC: все описанные POST /rest/v1/rpc/* принимают Content-Type: application/json
    с одним безымянным аргументом PostgreSQL jsonb. Тело запроса передаётся как camelCase JSON.
    Контракты RPC не заменяются многопараметрическими SQL-функциями со snake_case аргументами.

    Для операций с личными данными требуются apikey: sb_publishable_... и
    Authorization: Bearer <access JWT>. Одного publishable key недостаточно.
    Гостевые операции требуют apikey. Если клиент передаёт JWT, сервер проверяет его
    и применяет права пользователя; доступ к данным дополнительно защищён RLS.
    Публичные Edge Functions с verify_jwt=false проверяют apikey внутри обработчика,
    а функции с пользовательским доступом проверяют JWT явно.

    Бизнес-версия маршрутов — v1. info.version обозначает редакцию этого контракта.
    Идентификаторы в примерах условные. URL вида example.invalid не действуют.
servers:
- url: http://127.0.0.1:54321
  description: Локальный Supabase CLI; для Edge Functions требуется запущенный functions serve.
- url: https://{projectRef}.supabase.co
  description: Шаблон будущего облачного Supabase; SoundScape ещё не развёрнут и не проверен в облаке.
  variables:
    projectRef:
      default: your-project-ref
tags:
- name: Geography
- name: Playlists
- name: Pins
- name: Diary
- name: Journeys
- name: Catalog
- name: AI
- name: Sharing
paths:
  /rest/v1/rpc/get_visible_places:
    post:
      tags:
      - Geography
      summary: Места в видимом прямоугольнике карты
      operationId: getVisiblePlaces
      description: 'Публичные редакционные города и опубликованные PUBLIC-отметки. Личная PRIVATE-отметка доступна
        только владельцу при JWT. UNLISTED исключены из обзора. При minLon > maxLon учитывается пересечение антимеридиана.
        При наличии Authorization: Bearer <access JWT> сервер обязан проверить JWT и применить RLS пользователя;
        без JWT запрос выполняется как гость.'
      security:
      - PublishableKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisiblePlacesRequest'
            example:
              minLat: 35.0
              minLon: 139.0
              maxLat: 36.0
              maxLon: 140.0
              limit: 20
              offset: 0
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlacePage'
              example:
                items:
                - id: 11111111-1111-4111-8111-111111111111
                  kind: CITY
                  title: Токио
                  latitude: 35.6762
                  longitude: 139.6503
                  description: Музыкальная атмосфера города
                limit: 20
                offset: 0
                hasMore: false
        '400':
          $ref: '#/components/responses/RpcError'
        '401':
          $ref: '#/components/responses/RpcError'
        '403':
          $ref: '#/components/responses/RpcError'
        '429':
          $ref: '#/components/responses/RpcError'
        '500':
          $ref: '#/components/responses/RpcError'
  /rest/v1/rpc/get_nearby_places:
    post:
      tags:
      - Geography
      summary: Найти публичные места поблизости
      operationId: getNearbyPlaces
      description: ST_DWithin с PostGIS geography; координаты передаются по пользовательскому действию, не записываются
        как история местоположения.
      security:
      - PublishableKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NearbyPlacesRequest'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlacePage'
        '400':
          $ref: '#/components/responses/RpcError'
        '401':
          $ref: '#/components/responses/RpcError'
        '403':
          $ref: '#/components/responses/RpcError'
        '429':
          $ref: '#/components/responses/RpcError'
        '500':
          $ref: '#/components/responses/RpcError'
  /rest/v1/rpc/list_playlists:
    post:
      tags:
      - Playlists
      summary: Получить публичные или собственные плейлисты
      operationId: listPlaylists
      description: 'Для MINE необходим JWT. PUBLIC возвращает только опубликованные публичные подборки, UNLISTED
        не индексируются. При наличии Authorization: Bearer <access JWT> сервер обязан проверить JWT и применить
        RLS пользователя; без JWT запрос выполняется как гость.'
      security:
      - PublishableKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListPlaylistsRequest'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistPage'
        '400':
          $ref: '#/components/responses/RpcError'
        '401':
          $ref: '#/components/responses/RpcError'
        '403':
          $ref: '#/components/responses/RpcError'
        '429':
          $ref: '#/components/responses/RpcError'
        '500':
          $ref: '#/components/responses/RpcError'
  /rest/v1/rpc/get_playlist:
    post:
      tags:
      - Playlists
      summary: Получить разрешённый плейлист по ID
      operationId: getPlaylist
      description: 'Только PUBLIC или владелец (JWT); UNLISTED открываются по отдельному токенизированному маршруту.
        При наличии Authorization: Bearer <access JWT> сервер обязан проверить JWT и применить RLS пользователя;
        без JWT запрос выполняется как гость.'
      security:
      - PublishableKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetPlaylistRequest'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistDetail'
        '400':
          $ref: '#/components/responses/RpcError'
        '401':
          $ref: '#/components/responses/RpcError'
        '403':
          $ref: '#/components/responses/RpcError'
        '404':
          $ref: '#/components/responses/RpcError'
        '500':
          $ref: '#/components/responses/RpcError'
  /rest/v1/rpc/save_playlist:
    post:
      tags:
      - Playlists
      summary: Создать или изменить собственный плейлист
      operationId: savePlaylist
      description: Атомарно сохраняет плейлист и упорядоченный состав. Редакторские опубликованные подборки не изменяются
        этой пользовательской RPC. Для обновления обязателен expectedRevision, несовпадение → 409.
      security:
      - PublishableKey: []
        UserJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavePlaylistRequest'
            example:
              title: Ночной Токио
              description: Атмосферная музыка
              visibility: PRIVATE
              trackIds:
              - 55555555-5555-4555-8555-555555555555
              coverPath: playlist-covers/example.webp
              genreIds:
              - 3
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistDetail'
              example:
                id: 22222222-2222-4222-8222-222222222222
                ownerId: 33333333-3333-4333-8333-333333333333
                title: Ночной Токио
                description: Атмосферная музыка
                visibility: PRIVATE
                revision: 1
                items:
                - track:
                    id: 55555555-5555-4555-8555-555555555555
                    title: Пример проверенного трека
                    artist: Пример исполнителя
                    durationMs: 220000
                    availability: IN_APP
                    provider: audius
                  position: 1
                coverPath: playlist-covers/example.webp
                isEditorial: false
        '400':
          $ref: '#/components/responses/RpcError'
        '401':
          $ref: '#/components/responses/RpcError'
        '403':
          $ref: '#/components/responses/RpcError'
        '404':
          $ref: '#/components/responses/RpcError'
        '409':
          $ref: '#/components/responses/RpcError'
        '422':
          $ref: '#/components/responses/RpcError'
        '500':
          $ref: '#/components/responses/RpcError'
  /rest/v1/rpc/delete_playlist:
    post:
      tags:
      - Playlists
      summary: Удалить собственный плейлист
      operationId: deletePlaylist
      description: Только владелец, проверка версии; редакционные плейлисты защищены от удаления обычным пользователем.
      security:
      - PublishableKey: []
        UserJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteObjectRequest'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResult'
        '400':
          $ref: '#/components/responses/RpcError'
        '401':
          $ref: '#/components/responses/RpcError'
        '403':
          $ref: '#/components/responses/RpcError'
        '404':
          $ref: '#/components/responses/RpcError'
        '409':
          $ref: '#/components/responses/RpcError'
        '500':
          $ref: '#/components/responses/RpcError'
  /rest/v1/rpc/save_music_pin:
    post:
      tags:
      - Pins
      summary: Создать или изменить музыкальную отметку
      operationId: saveMusicPin
      description: 1+ существующих треков, до 5 фотографий; пути фото проверяются по Storage ownership и принадлежности
        к записи. Для обновления expectedRevision обязателен.
      security:
      - PublishableKey: []
        UserJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveMusicPinRequest'
            example:
              title: Музыка у реки
              latitude: 56.3287
              longitude: 44.002
              visibility: PRIVATE
              trackIds:
              - 55555555-5555-4555-8555-555555555555
              photoPaths: []
              visitDate: '2026-10-20'
              description: Воспоминание о прогулке
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MusicPinDetail'
              example:
                id: 44444444-4444-4444-8444-444444444444
                ownerId: 33333333-3333-4333-8333-333333333333
                title: Музыка у реки
                description: Воспоминание о прогулке
                latitude: 56.3287
                longitude: 44.002
                visibility: PRIVATE
                trackIds:
                - 55555555-5555-4555-8555-555555555555
                photoPaths: []
                revision: 1
                visitDate: '2026-10-20'
        '400':
          $ref: '#/components/responses/RpcError'
        '401':
          $ref: '#/components/responses/RpcError'
        '403':
          $ref: '#/components/responses/RpcError'
        '404':
          $ref: '#/components/responses/RpcError'
        '409':
          $ref: '#/components/responses/RpcError'
        '422':
          $ref: '#/components/responses/RpcError'
        '500':
          $ref: '#/components/responses/RpcError'
  /rest/v1/rpc/save_travel_event:
    post:
      tags:
      - Diary
      summary: Создать или изменить запись музыкального дневника
      operationId: saveTravelEvent
      description: По умолчанию PRIVATE; 1+ треков, до 10 фото, музыкальная отметка опциональна. expectedRevision
        обязателен при обновлении.
      security:
      - PublishableKey: []
        UserJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveTravelEventRequest'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TravelEventDetail'
        '400':
          $ref: '#/components/responses/RpcError'
        '401':
          $ref: '#/components/responses/RpcError'
        '403':
          $ref: '#/components/responses/RpcError'
        '404':
          $ref: '#/components/responses/RpcError'
        '409':
          $ref: '#/components/responses/RpcError'
        '422':
          $ref: '#/components/responses/RpcError'
        '500':
          $ref: '#/components/responses/RpcError'
  /rest/v1/rpc/list_travel_events:
    post:
      tags:
      - Diary
      summary: Получить собственные записи дневника
      operationId: listTravelEvents
      description: Возвращает только записи владельца, включая PRIVATE. Чужие PUBLIC/UNLISTED показываются через
        отдельные разрешённые маршруты.
      security:
      - PublishableKey: []
        UserJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListTravelEventsRequest'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TravelEventPage'
        '400':
          $ref: '#/components/responses/RpcError'
        '401':
          $ref: '#/components/responses/RpcError'
        '403':
          $ref: '#/components/responses/RpcError'
        '500':
          $ref: '#/components/responses/RpcError'
  /rest/v1/rpc/save_music_journey:
    post:
      tags:
      - Journeys
      summary: Создать или изменить музыкальное путешествие
      operationId: saveMusicJourney
      description: Минимум две разрешённые точки и явный порядок. Сервер проверяет доступность каждого PIN; длительность
        выводится из треков связанного плейлиста.
      security:
      - PublishableKey: []
        UserJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveJourneyRequest'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JourneyDetail'
        '400':
          $ref: '#/components/responses/RpcError'
        '401':
          $ref: '#/components/responses/RpcError'
        '403':
          $ref: '#/components/responses/RpcError'
        '404':
          $ref: '#/components/responses/RpcError'
        '409':
          $ref: '#/components/responses/RpcError'
        '422':
          $ref: '#/components/responses/RpcError'
        '500':
          $ref: '#/components/responses/RpcError'
  /functions/v1/v1-search:
    post:
      tags:
      - Catalog
      summary: Единый поиск по пяти категориям
      operationId: searchAll
      description: Поиск по композициям, исполнителям, плейлистам, городам/местам и пользователям. Не раскрывает
        чужой PRIVATE/UNLISTED-контент. Жанр, настроение и только IN_APP влияют на релевантные музыкальные результаты.
        Гость использует publishable key; необязательный JWT позволяет видеть собственные разрешённые объекты после
        проверки на сервере. Публичная Edge Function проверяет apikey на сервере (verify_jwt=false для ключевого
        режима).
      security:
      - PublishableKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnifiedSearchRequest'
            example:
              query: tokyo
              categories:
              - TRACK
              - ARTIST
              - PLAYLIST
              - PLACE
              - USER
              genreIds:
              - 3
              onlyInApp: false
              limit: 20
              offset: 0
      responses:
        '200':
          description: Найденные доступные объекты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnifiedSearchPage'
              example:
                items:
                - category: PLACE
                  id: 11111111-1111-4111-8111-111111111111
                  title: Токио
                  subtitle: Япония
                - category: TRACK
                  id: 55555555-5555-4555-8555-555555555555
                  title: Пример проверенного трека
                  subtitle: Пример исполнителя
                  availability: IN_APP
                limit: 20
                offset: 0
                hasMore: false
        '400':
          $ref: '#/components/responses/EdgeError'
        '401':
          $ref: '#/components/responses/EdgeError'
        '403':
          $ref: '#/components/responses/EdgeError'
        '429':
          $ref: '#/components/responses/EdgeError'
        '500':
          $ref: '#/components/responses/EdgeError'
        '502':
          $ref: '#/components/responses/EdgeError'
        '503':
          $ref: '#/components/responses/EdgeError'
  /functions/v1/v1-search-tracks:
    post:
      tags:
      - Catalog
      summary: Найти существующие проверенные композиции
      operationId: searchTracks
      description: 'Отдельная Edge Function: поиск через Audius с дедупликацией, только реальные
        provider IDs; не возвращать фиктивные внешние ссылки. Настройка JWT/publishable проверки Edge Function согласуется
        при деплое. Публичный вызов по apikey: проверка ключа в обработчике (verify_jwt=false для режима publishable);
        JWT пользователя необязателен, но при его наличии должен быть валидирован. Фильтры genreIds/moodIds опираются
        на нормализованные связи track_genres/track_moods.'
      security:
      - PublishableKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchTracksRequest'
            example:
              query: ambient tokyo
              onlyInApp: true
              limit: 20
              offset: 0
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogPage'
              example:
                items:
                - id: 55555555-5555-4555-8555-555555555555
                  title: Пример проверенного трека
                  artist: Пример исполнителя
                  durationMs: 220000
                  availability: IN_APP
                  provider: audius
                limit: 20
                offset: 0
                hasMore: false
        '400':
          $ref: '#/components/responses/EdgeError'
        '401':
          $ref: '#/components/responses/EdgeError'
        '403':
          $ref: '#/components/responses/EdgeError'
        '429':
          $ref: '#/components/responses/EdgeError'
        '500':
          $ref: '#/components/responses/EdgeError'
        '502':
          $ref: '#/components/responses/EdgeError'
        '503':
          $ref: '#/components/responses/EdgeError'
  /functions/v1/v1-resolve-track:
    post:
      tags:
      - Catalog
      summary: Получить актуальный допустимый аудиоисточник
      operationId: resolveTrack
      description: 'Возвращает временный URL для Media3 либо точную внешнюю ссылку; не проксирует аудиобайты. URL
        в примере явно фиктивный, не действующий аудиопоток. Права cache/download по умолчанию false до проверки.
        Настройка JWT/publishable проверки Edge Function согласуется при деплое. Публичный вызов по apikey: проверка
        ключа в обработчике (verify_jwt=false для режима publishable); JWT пользователя необязателен, но при его
        наличии должен быть валидирован.'
      security:
      - PublishableKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveTrackRequest'
            example:
              trackId: 55555555-5555-4555-8555-555555555555
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedSource'
              example:
                trackId: 55555555-5555-4555-8555-555555555555
                availability: IN_APP
                provider: audius
                streamUrl: https://audio.example.invalid/temporary-stream
                streamExpiresAt: '2030-01-02T12:30:00Z'
                externalUrl: null
                cacheAllowed: false
                downloadAllowed: false
        '400':
          $ref: '#/components/responses/EdgeError'
        '401':
          $ref: '#/components/responses/EdgeError'
        '403':
          $ref: '#/components/responses/EdgeError'
        '404':
          $ref: '#/components/responses/EdgeError'
        '429':
          $ref: '#/components/responses/EdgeError'
        '500':
          $ref: '#/components/responses/EdgeError'
        '502':
          $ref: '#/components/responses/EdgeError'
        '503':
          $ref: '#/components/responses/EdgeError'
  /functions/v1/v1-generate-playlist:
    post:
      tags:
      - AI
      summary: Сформировать ИИ-подборку из реальных кандидатов
      operationId: generatePlaylist
      description: Сервер получает реальные кандидаты, передаёт только разрешённые ID в GigaChat, валидирует JSON
        и IDs. Это предпросмотр, не сохраняет плейлист. Не передаёт личную историю и приватный дневник. Настройка
        JWT/publishable проверки Edge Function согласуется при деплое. Для этой операции обязателен JWT вошедшего
        пользователя, только apikey недостаточно.
      security:
      - PublishableKey: []
