components:
  securitySchemes:
    PublishableKey:
      type: apiKey
      in: header
      name: apikey
      description: Публичный ключ Supabase (sb_publishable_...). Не секрет, не JWT и не право на чужие данные.
    UserJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access JWT Supabase Auth от вошедшего пользователя; передавать в Authorization: Bearer <token>.'
  schemas:
    Visibility:
      type: string
      description: Доступность пользовательского объекта.
      enum:
      - PUBLIC
      - UNLISTED
      - PRIVATE
    ErrorEdge:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Некорректные параметры запроса
            requestId:
              type: string
              example: req_7e12
          required:
          - code
          - message
      required:
      - error
    ErrorPostgrest:
      type: object
      properties:
        code:
          type: string
          example: PT409
        message:
          type: string
          example: VERSION_CONFLICT
        details:
          type: string
          nullable: true
        hint:
          type: string
          nullable: true
      required:
      - code
      - message
    PlaceSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - CITY
          - PIN
        title:
          type: string
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        description:
          type: string
          nullable: true
        playlistId:
          type: string
          format: uuid
          nullable: true
          description: ID доступного редакционного плейлиста, если он опубликован.
        coverPath:
          type: string
          nullable: true
          description: Путь к опубликованной обложке места; не предоставляет обход прав Storage.
      required:
      - id
      - kind
      - title
      - latitude
      - longitude
    PlacePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlaceSummary'
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
        hasMore:
          type: boolean
      required:
      - items
      - limit
      - offset
      - hasMore
    TrackView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        artist:
          type: string
          description: Отображаемое имя исполнителя или нескольких исполнителей, вычисленное из artists и track_artists.
        durationMs:
          type: integer
          minimum: 1
        availability:
          type: string
          enum:
          - IN_APP
          - EXTERNAL_ONLY
          description: IN_APP или EXTERNAL_ONLY; определяется сервером из проверенных track_sources, не хранится
            отдельно в tracks.
        provider:
          type: string
          nullable: true
          description: Выбранный музыкальный источник из track_sources при наличии.
      required:
      - id
      - title
      - artist
      - durationMs
      - availability
    CatalogPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TrackView'
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
        hasMore:
          type: boolean
      required:
      - items
      - limit
      - offset
      - hasMore
    PlaylistItem:
      type: object
      properties:
        track:
          $ref: '#/components/schemas/TrackView'
        position:
          type: integer
          minimum: 1
      required:
      - track
      - position
    PlaylistSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        visibility:
          $ref: '#/components/schemas/Visibility'
        revision:
          type: integer
          minimum: 1
        isEditorial:
          type: boolean
        placeId:
          type: string
          format: uuid
          nullable: true
          description: Необязательная связь с редакционным местом.
        coverPath:
          type: string
          nullable: true
          description: Путь к разрешённой обложке; проверка доступа к Storage выполняется отдельно.
        genreIds:
          type: array
          items:
            type: integer
            format: int32
            minimum: 1
          uniqueItems: true
          description: Идентификаторы жанров из справочника genres (smallint).
          default: []
        tagIds:
          type: array
          items:
            type: integer
            format: int32
            minimum: 1
          uniqueItems: true
          description: Идентификаторы тематических тегов из tags (smallint).
          default: []
      required:
      - id
      - ownerId
      - title
      - visibility
      - revision
      - isEditorial
    PlaylistDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        visibility:
          $ref: '#/components/schemas/Visibility'
        revision:
          type: integer
          minimum: 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlaylistItem'
        placeId:
          type: string
          format: uuid
          nullable: true
          description: Необязательная связь с редакционным местом.
        coverPath:
          type: string
          nullable: true
          description: Путь к разрешённой обложке; проверка доступа к Storage выполняется отдельно.
        genreIds:
          type: array
          items:
            type: integer
            format: int32
            minimum: 1
          uniqueItems: true
          description: Идентификаторы жанров из справочника genres (smallint).
          default: []
        tagIds:
          type: array
          items:
            type: integer
            format: int32
            minimum: 1
          uniqueItems: true
          description: Идентификаторы тематических тегов из tags (smallint).
          default: []
        isEditorial:
          type: boolean
          description: Признак официальной редакционной подборки.
      required:
      - id
      - ownerId
      - title
      - visibility
      - revision
      - items
      description: Полные данные плейлиста в клиентском DTO; связи с жанрами/тегами возвращаются как идентификаторы.
    PlaylistPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlaylistSummary'
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
        hasMore:
          type: boolean
      required:
      - items
      - limit
      - offset
      - hasMore
    MusicPinDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        visibility:
          $ref: '#/components/schemas/Visibility'
        trackIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
        photoPaths:
          type: array
          items:
            type: string
          maxItems: 5
        revision:
          type: integer
          minimum: 1
        visitDate:
          type: string
          format: date
          nullable: true
          description: Необязательная дата посещения музыкальной отметки.
      required:
      - id
      - ownerId
      - title
      - latitude
      - longitude
      - visibility
      - trackIds
      - photoPaths
      - revision
    TravelEventDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        title:
          type: string
        eventDate:
          type: string
          format: date
        locationName:
          type: string
          nullable: true
          description: Необязательное название места; при отсутствии должны быть координаты или musicPinId.
        body:
          type: string
          nullable: true
        visibility:
          $ref: '#/components/schemas/Visibility'
        musicPinId:
          type: string
          format: uuid
          nullable: true
          description: Привязанная отметка при наличии.
        trackIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
        photoPaths:
          type: array
          items:
            type: string
          maxItems: 10
        revision:
          type: integer
          minimum: 1
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          nullable: true
          description: Широта точки дневника, заполняется вместе с longitude.
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          nullable: true
          description: Долгота точки дневника, заполняется вместе с latitude.
      required:
      - id
      - ownerId
      - title
      - eventDate
      - visibility
      - trackIds
      - photoPaths
      - revision
      description: 'Указать хотя бы одно местоположение: locationName, musicPinId или пару latitude/longitude. Координаты
        передаются обе или ни одна; проверяется сервером.'
    TravelEventPage:
      type: object
      properties:
        items:
