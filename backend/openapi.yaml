      type: string
      format: uuid
      description: UUID операции в пределах аккаунта; одинаковый метод и тело возвращают исходный ответ. Повторное использование для другого тела или метода даёт 409 IDEMPOTENCY_KEY_REUSED.
    ShareKind:
      type: string
      enum: [PLAYLIST, MUSIC_PIN, TRAVEL_EVENT, JOURNEY, PROFILE]
    TargetedShareRequest:
      type: object
      required: [objectType, objectId]
      properties:
        objectType: {$ref: '#/components/schemas/ShareKind'}
        objectId: {type: string, format: uuid}
        token: {type: string, minLength: 32, maxLength: 256, writeOnly: true}
    DeleteAccountRequest:
      type: object
      required: [confirm]
      properties:
        confirm: {type: boolean, enum: [true]}
      additionalProperties: false
    DeleteAccountResult:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [PENDING, DELETED]}
    ProfileId:
      type: object
      required: [profileId]
      properties:
        profileId: {type: string, format: uuid}
    OwnProfile:
      type: object
      required: [id, username, role, avatarPath, createdAt]
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        role: {type: string, enum: [USER, EDITOR, ADMIN]}
        avatarPath: {type: string, nullable: true}
        createdAt: {type: string, format: date-time}
    PublicProfile:
      type: object
      required: [id, username, hasAvatar]
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        hasAvatar: {type: boolean}
    UpdateMyProfile:
      type: object
      properties:
        username: {type: string, minLength: 1, maxLength: 40}
        avatarPath: {type: string, nullable: true}
      minProperties: 1
      additionalProperties: false
    PublicProfileItemsRequest:
      type: object
      required: [profileId, kind]
      properties:
        profileId: {type: string, format: uuid}
        kind: {type: string, enum: [PLAYLIST, MUSIC_PIN, TRAVEL_EVENT, JOURNEY]}
        limit: {type: integer, minimum: 1, maximum: 100, default: 20}
        offset: {type: integer, minimum: 0, default: 0}
    PublicProfileItem:
      type: object
      required: [id, title, kind]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        kind: {$ref: '#/components/schemas/ShareKind'}
    OffsetPageRequest:
      type: object
      properties:
        limit: {type: integer, minimum: 1, maximum: 100, default: 20}
        offset: {type: integer, minimum: 0, default: 0}
    MusicPinPage:
      type: object
      required: [items, limit, offset, hasMore]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/MusicPinDetail'}
        limit: {type: integer}
        offset: {type: integer}
        hasMore: {type: boolean}
    PublicProfileItemsPage:
      type: object
      required: [items, limit, offset, hasMore]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/PublicProfileItem'}
        limit: {type: integer, minimum: 1, maximum: 100, default: 20}
        offset: {type: integer, minimum: 0, default: 0}
        hasMore: {type: boolean}
    MyCollectionRequest:
      type: object
      required: [kind]
      properties:
        kind: {type: string, enum: [FAVORITE, SAVED_PLAYLIST]}
        limit: {type: integer, minimum: 1, maximum: 100, default: 20}
        offset: {type: integer, minimum: 0, default: 0}
    MyCollectionPage:
      type: object
      required: [items, limit, offset, hasMore]
      properties:
        items:
          type: array
          items: {oneOf: [{$ref: '#/components/schemas/TrackView'}, {$ref: '#/components/schemas/PlaylistSummary'}]}
        limit: {type: integer, minimum: 1, maximum: 100, default: 20}
        offset: {type: integer, minimum: 0, default: 0}
        hasMore: {type: boolean}
    SocialStateRequest:
      type: object
      required: [kind, targetId]
      properties:
        kind: {type: string, enum: [PLAYLIST_LIKE, PIN_LIKE, FAVORITE, SAVED_PLAYLIST]}
        targetId: {type: string, format: uuid}
        active: {type: boolean, description: Установка целевого состояния. Без поля выполняется чтение.}
      description: JWT требуется для записи и чтения личных коллекций. Для гостя чтение лайка показывает active=false и публичное число лайков.
    SocialState:
      type: object
      required: [active, count]
      properties:
        active: {type: boolean}
        count: {type: integer, format: int64, nullable: true, minimum: 0}
    CopyPlaylistRequest:
      type: object
      required: [sourcePlaylistId]
      properties:
        sourcePlaylistId: {type: string, format: uuid}
        playlistId: {type: string, format: uuid}
        idempotencyKey: {$ref: '#/components/schemas/IdempotencyKey'}
    CleanupMediaRequest:
      type: object
      required: [action]
      properties:
        action: {type: string, enum: [CLEANUP]}
    CleanupMediaResult:
      type: object
      required: [processed]
      properties:
        processed: {type: integer, minimum: 0, maximum: 20}
    AuthEmail:
      type: object
      required: [email]
      properties:
        email: {type: string, format: email}
    AuthNewPassword:
      type: object
      required: [password]
      properties:
        password: {type: string, format: password, writeOnly: true}
    AuthEmailPassword:
      allOf: [{$ref: '#/components/schemas/AuthEmail'}, {$ref: '#/components/schemas/AuthNewPassword'}]
    AuthTokenRequest:
      oneOf:
      - {$ref: '#/components/schemas/AuthEmailPassword'}
      - type: object
        required: [refresh_token]
        properties:
          refresh_token: {type: string, writeOnly: true}
      - type: object
        required: [auth_code, code_verifier]
        properties:
          auth_code: {type: string, writeOnly: true}
          code_verifier: {type: string, writeOnly: true}
    AuthVerify:
      type: object
      required: [type]
      properties:
        type: {type: string, enum: [email, signup, recovery]}
        email: {type: string, format: email}
        token: {type: string, writeOnly: true}
        token_hash: {type: string, writeOnly: true}
      oneOf:
      - required: [email, token]
      - required: [token_hash]
    AuthUser:
      type: object
      required: [id]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        email_confirmed_at: {type: string, format: date-time}
    AuthSession:
      type: object
      required: [access_token, refresh_token, user]
      properties:
        access_token: {type: string}
        refresh_token: {type: string}
        expires_in: {type: integer, minimum: 0}
        token_type: {type: string}
        user: {$ref: '#/components/schemas/AuthUser'}
    AuthSignup:
      anyOf: [{$ref: '#/components/schemas/AuthUser'}, {$ref: '#/components/schemas/AuthSession'}]
    AuthProblem:
      type: object
      properties:
        code: {oneOf: [{type: string}, {type: integer}]}
        error_code: {type: string}
        msg: {type: string}
        error_description: {type: string}
  responses:
    AuthError: {description: Ошибка стандартного Supabase Auth, content: {application/json: {schema: {$ref: '#/components/schemas/AuthProblem'}}}}
    RpcError: {description: Ошибка PostgREST/RPC. Причина определяется HTTP-кодом и полями code/message., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorPostgrest'}}}}
    EdgeError: {description: Ошибка Edge Function. Причина определяется HTTP-кодом и полями error.code/error.message., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEdge'}}}}
