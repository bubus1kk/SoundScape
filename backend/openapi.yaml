openapi: 3.0.3
info:
  title: SoundScape — серверные HTTP-контракты
  version: 1.3.0
  description: |
    Контракт HTTP API SoundScape (Supabase/PostgreSQL/PostGIS/Auth/Storage/Edge). Облако развёрнуто: 7 миграций, 17 RPC, 7 Edge Functions. Проверены Audius, GigaChat, авторизация, валидация, единые ошибки, логи и HTTP 429;

    RPC: POST /rest/v1/rpc/*; Content-Type: application/json; один безымянный аргумент jsonb, тело — исходный camelCase JSON. Гостевые вызовы требуют заголовок apikey (Supabase publishable key). Для личных данных дополнительно нужен Authorization: Bearer <access JWT>; права проверяются через JWT/RLS. Edge Functions опубликованы с verify_jwt=false, а ключ и необходимый JWT проверяются обработчиками.

    GENERATE: максимум 5 попыток на пользователя и 50 на проект в сутки UTC; считаются также неуспешные попытки после резервирования квоты, сброс в 00:00 UTC. Маршруты имеют бизнес-версию v1; info.version — версия документа.
servers:
- url: https://spgawlqdkzoxgrncunxg.supabase.co
  description: Развёрнутый SoundScape — production Supabase (проверен по HTTPS).
- url: http://127.0.0.1:54321
  description: Локальный Supabase CLI; для Edge Functions требуется запущенный functions serve.
tags:
- name: Geography
- name: Playlists
- name: Pins
- name: Diary
- name: Journeys
- name: Catalog
- name: AI
- name: Sharing
paths:
  /rest/v1/rpc/get_visible_places:
    post:
      tags: [Geography]
      summary: Места в видимом прямоугольнике карты
      operationId: getVisiblePlaces
      description: Публичные редакционные города и опубликованные PUBLIC-отметки. Личная PRIVATE-отметка доступна только владельцу при JWT. UNLISTED исключены из обзора. При minLon > maxLon учитывается пересечение антимеридиана.
      security: [{PublishableKey: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VisiblePlacesRequest'}}}}
      responses:
        '200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/PlacePage'}}}}
        '400': {$ref: '#/components/responses/RpcError'}
        '401': {$ref: '#/components/responses/RpcError'}
        '403': {$ref: '#/components/responses/RpcError'}
        '429': {$ref: '#/components/responses/RpcError'}
        '500': {$ref: '#/components/responses/RpcError'}
  /rest/v1/rpc/get_nearby_places:
    post:
      tags: [Geography]
      summary: Найти публичные места поблизости
      operationId: getNearbyPlaces
      description: ST_DWithin с PostGIS geography; координаты передаются по пользовательскому действию, не записываются как история местоположения.
      security: [{PublishableKey: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NearbyPlacesRequest'}}}}
      responses:
        '200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/PlacePage'}}}}
        '400': {$ref: '#/components/responses/RpcError'}
        '401': {$ref: '#/components/responses/RpcError'}
        '403': {$ref: '#/components/responses/RpcError'}
        '429': {$ref: '#/components/responses/RpcError'}
        '500': {$ref: '#/components/responses/RpcError'}
  /rest/v1/rpc/list_playlists:
    post:
      tags: [Playlists]
      summary: Получить публичные или собственные плейлисты
      operationId: listPlaylists
      description: Для MINE необходим JWT. PUBLIC возвращает только опубликованные публичные подборки, UNLISTED не индексируются.
      security: [{PublishableKey: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ListPlaylistsRequest'}}}}
      responses:
        '200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/PlaylistPage'}}}}
        '400': {$ref: '#/components/responses/RpcError'}
        '401': {$ref: '#/components/responses/RpcError'}
        '403': {$ref: '#/components/responses/RpcError'}
        '429': {$ref: '#/components/responses/RpcError'}
        '500': {$ref: '#/components/responses/RpcError'}
  /rest/v1/rpc/get_playlist:
    post:
      tags: [Playlists]
      summary: Получить разрешённый плейлист по ID
      operationId: getPlaylist
      description: Только PUBLIC или владелец (JWT); UNLISTED открываются по отдельному токенизированному маршруту.
      security: [{PublishableKey: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GetPlaylistRequest'}}}}
      responses:
        '200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/PlaylistDetail'}}}}
        '400': {$ref: '#/components/responses/RpcError'}
        '401': {$ref: '#/components/responses/RpcError'}
        '403': {$ref: '#/components/responses/RpcError'}
        '404': {$ref: '#/components/responses/RpcError'}
        '500': {$ref: '#/components/responses/RpcError'}
  /rest/v1/rpc/save_playlist:
    post:
      tags: [Playlists]
      summary: Создать или изменить собственный плейлист
      operationId: savePlaylist
      description: Атомарно сохраняет плейлист и упорядоченный состав. Редакторские опубликованные подборки не изменяются этой пользовательской RPC. Для обновления обязателен expectedRevision, несовпадение → 409.
      security: [{PublishableKey: [], UserJwt: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SavePlaylistRequest'}}}}
      responses:
        '200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/PlaylistDetail'}}}}
        '400': {$ref: '#/components/responses/RpcError'}
        '401': {$ref: '#/components/responses/RpcError'}
        '403': {$ref: '#/components/responses/RpcError'}
        '404': {$ref: '#/components/responses/RpcError'}
        '409': {$ref: '#/components/responses/RpcError'}
        '422': {$ref: '#/components/responses/RpcError'}
        '500': {$ref: '#/components/responses/RpcError'}
  /rest/v1/rpc/delete_playlist:
    post:
      tags: [Playlists]
      summary: Удалить собственный плейлист
      operationId: deletePlaylist
      description: Только владелец, проверка версии; редакционные плейлисты защищены от удаления обычным пользователем.
      security: [{PublishableKey: [], UserJwt: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DeleteObjectRequest'}}}}
      responses:
        '200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/ActionResult'}}}}
        '400': {$ref: '#/components/responses/RpcError'}
        '401': {$ref: '#/components/responses/RpcError'}
        '403': {$ref: '#/components/responses/RpcError'}
        '404': {$ref: '#/components/responses/RpcError'}
        '409': {$ref: '#/components/responses/RpcError'}
        '500': {$ref: '#/components/responses/RpcError'}
  /rest/v1/rpc/save_music_pin:
    post:
      tags: [Pins]
      summary: Создать или изменить музыкальную отметку
      operationId: saveMusicPin
      description: 1+ существующих треков, до 5 фотографий; пути фото проверяются по Storage ownership и принадлежности к записи. Для обновления expectedRevision обязателен.
      security: [{PublishableKey: [], UserJwt: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SaveMusicPinRequest'}}}}
      responses:
        '200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/MusicPinDetail'}}}}
        '400': {$ref: '#/components/responses/RpcError'}
        '401': {$ref: '#/components/responses/RpcError'}
        '403': {$ref: '#/components/responses/RpcError'}
        '404': {$ref: '#/components/responses/RpcError'}
        '409': {$ref: '#/components/responses/RpcError'}
        '422': {$ref: '#/components/responses/RpcError'}
        '500': {$ref: '#/components/responses/RpcError'}
  /rest/v1/rpc/save_travel_event:
    post:
      tags: [Diary]
      summary: Создать или изменить запись музыкального дневника
      operationId: saveTravelEvent
      description: По умолчанию PRIVATE; 1+ треков, до 10 фото, музыкальная отметка опциональна. expectedRevision обязателен при обновлении.
      security: [{PublishableKey: [], UserJwt: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SaveTravelEventRequest'}}}}
      responses:
        '200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/TravelEventDetail'}}}}
        '400': {$ref: '#/components/responses/RpcError'}
        '401': {$ref: '#/components/responses/RpcError'}
        '403': {$ref: '#/components/responses/RpcError'}
        '404': {$ref: '#/components/responses/RpcError'}
        '409': {$ref: '#/components/responses/RpcError'}
        '422': {$ref: '#/components/responses/RpcError'}
        '500': {$ref: '#/components/responses/RpcError'}
  /rest/v1/rpc/list_travel_events:
    post:
      tags: [Diary]
      summary: Получить собственные записи дневника
      operationId: listTravelEvents
      description: Возвращает только записи владельца, включая PRIVATE. Чужие PUBLIC/UNLISTED показываются через отдельные разрешённые маршруты.
      security: [{PublishableKey: [], UserJwt: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ListTravelEventsRequest'}}}}
      responses:
        '200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/TravelEventPage'}}}}
        '400': {$ref: '#/components/responses/RpcError'}
        '401': {$ref: '#/components/responses/RpcError'}
        '403': {$ref: '#/components/responses/RpcError'}
        '500': {$ref: '#/components/responses/RpcError'}
  /rest/v1/rpc/save_music_journey:
    post:
      tags: [Journeys]
      summary: Создать или изменить музыкальное путешествие
      operationId: saveMusicJourney
      description: Минимум две разрешённые точки и явный порядок. Сервер проверяет доступность каждого PIN; длительность выводится из треков связанного плейлиста.
      security: [{PublishableKey: [], UserJwt: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SaveJourneyRequest'}}}}
      responses:
        '200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/JourneyDetail'}}}}
        '400': {$ref: '#/components/responses/RpcError'}
        '401': {$ref: '#/components/responses/RpcError'}
        '403': {$ref: '#/components/responses/RpcError'}
        '404': {$ref: '#/components/responses/RpcError'}
        '409': {$ref: '#/components/responses/RpcError'}
        '422': {$ref: '#/components/responses/RpcError'}
        '500': {$ref: '#/components/responses/RpcError'}
  /functions/v1/v1-search:
    post:
      tags: [Catalog]
      summary: Единый поиск по пяти категориям
      operationId: searchAll
      description: Поиск по композициям, исполнителям, плейлистам, городам/местам и пользователям. Не раскрывает чужой PRIVATE/UNLISTED-контент. Жанр, настроение и только IN_APP влияют на релевантные музыкальные результаты. Гость использует publishable key; необязательный JWT позволяет видеть собственные разрешённые объекты после проверки на сервере.
      security: [{PublishableKey: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UnifiedSearchRequest'}}}}
      responses:
        '200': {description: Найденные доступные объекты, content: {application/json: {schema: {$ref: '#/components/schemas/UnifiedSearchPage'}}}}
        '400': {$ref: '#/components/responses/EdgeError'}
        '401': {$ref: '#/components/responses/EdgeError'}
        '403': {$ref: '#/components/responses/EdgeError'}
        '429': {$ref: '#/components/responses/EdgeError'}
        '500': {$ref: '#/components/responses/EdgeError'}
        '502': {$ref: '#/components/responses/EdgeError'}
        '503': {$ref: '#/components/responses/EdgeError'}
  /functions/v1/v1-search-tracks:
    post:
      tags: [Catalog]
      summary: Найти существующие проверенные композиции
      operationId: searchTracks
      description: 'Отдельная Edge Function: поиск через Audius с дедупликацией, только реальные provider IDs; не возвращать фиктивные внешние ссылки. В production verify_jwt=false, apikey проверяется в обработчике. JWT пользователя необязателен, но при наличии валидируется. Фильтры genreIds/moodIds опираются на связи track_genres/track_moods.'
      security: [{PublishableKey: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SearchTracksRequest'}}}}
      responses:
        '200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/CatalogPage'}}}}
        '400': {$ref: '#/components/responses/EdgeError'}
        '401': {$ref: '#/components/responses/EdgeError'}
        '403': {$ref: '#/components/responses/EdgeError'}
        '429': {$ref: '#/components/responses/EdgeError'}
        '500': {$ref: '#/components/responses/EdgeError'}
        '502': {$ref: '#/components/responses/EdgeError'}
        '503': {$ref: '#/components/responses/EdgeError'}
  /functions/v1/v1-resolve-track:
    post:
      tags: [Catalog]
      summary: Получить актуальный допустимый аудиоисточник
      operationId: resolveTrack
      description: Возвращает временный URL для Media3 либо точную внешнюю ссылку; не проксирует аудиобайты. URL в примере явно фиктивный, не действующий аудиопоток. Права cache/download по умолчанию false до проверки. В production verify_jwt=false, apikey проверяется в обработчике. JWT пользователя необязателен, но при наличии валидируется.
      security: [{PublishableKey: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ResolveTrackRequest'}}}}
      responses:
        '200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/ResolvedSource'}}}}
        '400': {$ref: '#/components/responses/EdgeError'}
        '401': {$ref: '#/components/responses/EdgeError'}
        '403': {$ref: '#/components/responses/EdgeError'}
        '404': {$ref: '#/components/responses/EdgeError'}
        '429': {$ref: '#/components/responses/EdgeError'}
        '500': {$ref: '#/components/responses/EdgeError'}
        '502': {$ref: '#/components/responses/EdgeError'}
        '503': {$ref: '#/components/responses/EdgeError'}
  /functions/v1/v1-generate-playlist:
    post:
      tags: [AI]
      summary: Сформировать ИИ-подборку из реальных кандидатов
      operationId: generatePlaylist
      description: Сервер получает реальные кандидаты, передаёт только разрешённые ID в GigaChat, валидирует JSON и IDs. Это предпросмотр, не сохраняет плейлист. Не передаёт личную историю и приватный дневник. Опубликованная Edge Function использует verify_jwt=false, проверяет apikey и требует валидный JWT вошедшего пользователя; только apikey недостаточно. В production используется модель GigaChat-2.
      security: [{PublishableKey: [], UserJwt: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GeneratePlaylistRequest'}}}}
      responses:
        '200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/GeneratedPlaylist'}}}}
        '400': {$ref: '#/components/responses/EdgeError'}
        '401': {$ref: '#/components/responses/EdgeError'}
        '403': {$ref: '#/components/responses/EdgeError'}
        '422': {$ref: '#/components/responses/EdgeError'}
        '429': {$ref: '#/components/responses/EdgeError'}
        '500': {$ref: '#/components/responses/EdgeError'}
        '502': {$ref: '#/components/responses/EdgeError'}
        '503': {$ref: '#/components/responses/EdgeError'}
  /functions/v1/v1-open-share:
    post:
      tags: [Sharing]
      summary: Открыть UNLISTED-материал по секретному токену
      operationId: openShare
      description: Только действующий токен; хранить в БД исключительно хеш токена. Выдавать ограниченное представление объекта с соблюдением правил доступа к медиа. Отзыв немедленно блокирует последующие запросы. В production verify_jwt=false, apikey проверяется в обработчике; JWT пользователя необязателен, но при наличии валидируется. Дополнительно проверяются expires_at и revoked_at токена.
      security: [{PublishableKey: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OpenShareRequest'}}}}
      responses:
        '200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/ShareResult'}}}}
        '400': {$ref: '#/components/responses/EdgeError'}
        '401': {$ref: '#/components/responses/EdgeError'}
        '403': {$ref: '#/components/responses/EdgeError'}
        '404': {$ref: '#/components/responses/EdgeError'}
        '429': {$ref: '#/components/responses/EdgeError'}
        '500': {$ref: '#/components/responses/EdgeError'}
  /rest/v1/rpc/get_music_pin:
    post:
      tags: [Pins]
      summary: Получить разрешённую музыкальную отметку
      operationId: get_music_pin
      security: [{PublishableKey: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ObjectIdRequest'}}}}
      responses:
        '200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/MusicPinDetail'}}}}
        '400': {$ref: '#/components/responses/RpcError'}
        '401': {$ref: '#/components/responses/RpcError'}
        '403': {$ref: '#/components/responses/RpcError'}
        '404': {$ref: '#/components/responses/RpcError'}
        '409': {$ref: '#/components/responses/RpcError'}
        '422': {$ref: '#/components/responses/RpcError'}
        '500': {$ref: '#/components/responses/RpcError'}
  /rest/v1/rpc/get_travel_event:
    post:
      tags: [Diary]
      summary: Получить разрешённую запись дневника
      operationId: get_travel_event
      security: [{PublishableKey: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ObjectIdRequest'}}}}
      responses:
        '200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/TravelEventDetail'}}}}
        '400': {$ref: '#/components/responses/RpcError'}
        '401': {$ref: '#/components/responses/RpcError'}
        '403': {$ref: '#/components/responses/RpcError'}
        '404': {$ref: '#/components/responses/RpcError'}
        '409': {$ref: '#/components/responses/RpcError'}
        '422': {$ref: '#/components/responses/RpcError'}
        '500': {$ref: '#/components/responses/RpcError'}
  /rest/v1/rpc/get_music_journey:
    post:
      tags: [Journeys]
      summary: Получить разрешённое путешествие
      operationId: get_music_journey
      security: [{PublishableKey: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ObjectIdRequest'}}}}
      responses:
        '200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/JourneyDetail'}}}}
        '400': {$ref: '#/components/responses/RpcError'}
        '401': {$ref: '#/components/responses/RpcError'}
        '403': {$ref: '#/components/responses/RpcError'}
        '404': {$ref: '#/components/responses/RpcError'}
        '409': {$ref: '#/components/responses/RpcError'}
        '422': {$ref: '#/components/responses/RpcError'}
        '500': {$ref: '#/components/responses/RpcError'}
  /rest/v1/rpc/list_music_journeys:
    post:
      tags: [Journeys]
      summary: Список публичных или собственных путешествий
      operationId: list_music_journeys
      security: [{PublishableKey: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ListMusicJourneysRequest'}}}}
      responses:
        '200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/MusicJourneyPage'}}}}
        '400': {$ref: '#/components/responses/RpcError'}
        '401': {$ref: '#/components/responses/RpcError'}
        '403': {$ref: '#/components/responses/RpcError'}
        '404': {$ref: '#/components/responses/RpcError'}
