openapi: 3.0.3
info:
  title: SoundScape — серверные HTTP-контракты
  version: 1.4.1
  description: |
    Контракт HTTP API SoundScape (Supabase/PostgreSQL/PostGIS/Auth/Storage/Edge). Спецификация включает локальные изменения BE-02. Доступность каждой операции в облаке зависит от применённых миграций и развёрнутых функций.

    RPC принимает POST /rest/v1/rpc/* с Content-Type application/json и исходным camelCase JSON в теле. Гостевые вызовы требуют apikey. Для личных операций USER, EDITOR и ADMIN передают Authorization с действующим JWT. Сервер проверяет сессию и права. API редакционного управления описывается отдельно.

    GENERATE: максимум 5 попыток на пользователя и 50 на проект в сутки UTC; считаются также неуспешные попытки после резервирования квоты, сброс в 00:00 UTC. Маршруты имеют бизнес-версию v1; info.version — версия документа.
servers:
- url: https://spgawlqdkzoxgrncunxg.supabase.co
  description: Существующий облачный SoundScape. Изменения BE-02 требуют отдельного развёртывания.
- url: http://127.0.0.1:54321
  description: Локальный Supabase CLI со включённым Edge Runtime.
tags:
- name: Geography
- name: Playlists
- name: Pins
- name: Diary
- name: Journeys
- name: Catalog
- name: AI
- name: Sharing
- name: Auth
- name: Profiles
- name: Social
paths:
  /rest/v1/rpc/get_my_profile:
    post:
      tags: [Profiles]
      summary: Получить собственный профиль
      operationId: get_my_profile
      security: [{PublishableKey: [], UserJwt: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EmptyObject'}}}}
      responses:
        '200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/OwnProfile'}}}}
        '401': {$ref: '#/components/responses/RpcError'}
        '404': {$ref: '#/components/responses/RpcError'}
  /rest/v1/rpc/update_my_profile:
    post:
      tags: [Profiles]
      summary: Изменить username или аватар
      operationId: update_my_profile
      security: [{PublishableKey: [], UserJwt: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateMyProfile'}}}}
      responses:
        '200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/OwnProfile'}}}}
        '401': {$ref: '#/components/responses/RpcError'}
        '404': {$ref: '#/components/responses/RpcError'}
        '409': {$ref: '#/components/responses/RpcError'}
        '422': {$ref: '#/components/responses/RpcError'}
  /rest/v1/rpc/get_public_profile:
    post:
      tags: [Profiles]
      summary: Получить публичный профиль по UUID
      operationId: get_public_profile
      security: [{PublishableKey: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProfileId'}}}}
      responses:
        '200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/PublicProfile'}}}}
        '400': {$ref: '#/components/responses/RpcError'}
        '401': {$ref: '#/components/responses/RpcError'}
        '404': {$ref: '#/components/responses/RpcError'}
  /rest/v1/rpc/list_public_profile_items:
    post:
      tags: [Profiles]
      summary: Получить только публичные материалы профиля
      operationId: list_public_profile_items
      security: [{PublishableKey: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PublicProfileItemsRequest'}}}}
      responses:
        '200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/PublicProfileItemsPage'}}}}
        '400': {$ref: '#/components/responses/RpcError'}
        '401': {$ref: '#/components/responses/RpcError'}
        '404': {$ref: '#/components/responses/RpcError'}
        '422': {$ref: '#/components/responses/RpcError'}
  /rest/v1/rpc/social_state:
    post:
      tags: [Social]
      summary: Прочитать или установить состояние социального действия
      operationId: social_state
      security: [{PublishableKey: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SocialStateRequest'}}}}
      responses:
        '200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/SocialState'}}}}
        '400': {$ref: '#/components/responses/RpcError'}
        '401': {$ref: '#/components/responses/RpcError'}
        '403': {$ref: '#/components/responses/RpcError'}
        '404': {$ref: '#/components/responses/RpcError'}
        '422': {$ref: '#/components/responses/RpcError'}
  /rest/v1/rpc/list_my_collection:
    post:
      tags: [Social]
      summary: Получить личное избранное или сохранённые плейлисты
      operationId: list_my_collection
      security: [{PublishableKey: [], UserJwt: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MyCollectionRequest'}}}}
      responses:
        '200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/MyCollectionPage'}}}}
        '400': {$ref: '#/components/responses/RpcError'}
        '401': {$ref: '#/components/responses/RpcError'}
        '422': {$ref: '#/components/responses/RpcError'}
  /rest/v1/rpc/list_my_music_pins:
    post:
      tags: [Pins]
      summary: Список собственных музыкальных отметок всех режимов видимости
      operationId: list_my_music_pins
      security: [{PublishableKey: [], UserJwt: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OffsetPageRequest'}}}}
      responses:
        '200': {description: Страница по дате изменения и UUID, content: {application/json: {schema: {$ref: '#/components/schemas/MusicPinPage'}}}}
        '400': {$ref: '#/components/responses/RpcError'}
        '401': {$ref: '#/components/responses/RpcError'}
        '422': {$ref: '#/components/responses/RpcError'}
  /rest/v1/rpc/copy_public_playlist:
    post:
      tags: [Playlists]
      summary: Создать независимую приватную копию чужого плейлиста
      operationId: copy_public_playlist
      security: [{PublishableKey: [], UserJwt: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CopyPlaylistRequest'}}}}
      responses:
        '200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/PlaylistDetail'}}}}
        '401': {$ref: '#/components/responses/RpcError'}
        '404': {$ref: '#/components/responses/RpcError'}
        '409': {$ref: '#/components/responses/RpcError'}
        '422': {$ref: '#/components/responses/RpcError'}
  /functions/v1/v1-delete-account:
    post:
      tags: [Auth]
      summary: Удалить свой аккаунт и связанные данные
      operationId: deleteAccount
      description: Обрабатывает до 100 файлов за вызов. При 202 клиент может повторить запрос с действующей сессией. Служебная обработка продолжает сохранённую операцию после завершения сессии. После удаления прежние сессии недействительны для Data API, Edge и Storage.
      security: [{PublishableKey: [], UserJwt: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DeleteAccountRequest'}}}}
      responses:
        '200': {description: Аккаунт удалён, content: {application/json: {schema: {$ref: '#/components/schemas/DeleteAccountResult'}}}}
        '202': {description: Удаление ожидает следующей попытки, content: {application/json: {schema: {$ref: '#/components/schemas/DeleteAccountResult'}}}}
        '400': {$ref: '#/components/responses/EdgeError'}
        '401': {$ref: '#/components/responses/EdgeError'}
        '422': {$ref: '#/components/responses/EdgeError'}
        '502': {$ref: '#/components/responses/EdgeError'}
        '503': {$ref: '#/components/responses/EdgeError'}
  /share/{objectType}/{objectId}:
    servers:
    - url: http://127.0.0.1:54321/functions/v1/v1-open-share
      description: Прямой локальный путь для проверки маршрута.
    - url: https://{shareHost}
      description: Внешний HTTPS-хостинг после согласования домена и настройки прокси.
      variables:
        shareHost: {default: example.invalid}
    parameters:
    - {in: path, name: objectType, required: true, schema: {$ref: '#/components/schemas/ShareKind'}}
    - {in: path, name: objectId, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Sharing]
      summary: Открыть страницу обмена на настроенном HTTPS-домене
      description: Хостинг направляет GET и POST на v1-open-share. Секрет UNLISTED передаётся в URL-фрагменте и извлекается страницей для POST.
      operationId: shareWebFallback
      security: []
      responses:
        '200': {description: Страница SoundScape, content: {text/html: {schema: {type: string}}}}
        '400': {$ref: '#/components/responses/EdgeError'}
        '404': {$ref: '#/components/responses/EdgeError'}
        '503': {$ref: '#/components/responses/EdgeError'}
    post:
      tags: [Sharing]
      summary: Разрешить объект для веб-страницы обмена
      description: Клиент передаёт objectType и objectId из пути в теле. UNLISTED дополнительно требует token.
      operationId: resolveShareWebFallback
      security: [{PublishableKey: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TargetedShareRequest'}}}}
      responses:
        '200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/ShareResult'}}}}
        '400': {$ref: '#/components/responses/EdgeError'}
        '401': {$ref: '#/components/responses/EdgeError'}
        '404': {$ref: '#/components/responses/EdgeError'}
        '429': {$ref: '#/components/responses/EdgeError'}
        '503': {$ref: '#/components/responses/EdgeError'}
  /auth/v1/signup:
    post:
      tags: [Auth]
      summary: Регистрация email и пароля
      operationId: signup
      description: Тестовый стенд требует подтверждения email через локальную почту.
      security: [{PublishableKey: []}]
      parameters:
      - {in: query, name: redirect_to, schema: {type: string, format: uri}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AuthEmailPassword'}}}}
      responses:
        '200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/AuthSignup'}}}}
        '400': {$ref: '#/components/responses/AuthError'}
        '401': {$ref: '#/components/responses/AuthError'}
        '403': {$ref: '#/components/responses/AuthError'}
        '422': {$ref: '#/components/responses/AuthError'}
        '429': {$ref: '#/components/responses/AuthError'}
        '500': {$ref: '#/components/responses/AuthError'}
  /auth/v1/recover:
    post:
      tags: [Auth]
      summary: Отправить ссылку для восстановления пароля
      operationId: recoverPassword
      description: Ответ сохраняет приватность существования аккаунта.
      security: [{PublishableKey: []}]
      parameters:
      - {in: query, name: redirect_to, schema: {type: string, format: uri}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AuthEmail'}}}}
      responses:
        '200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/EmptyObject'}}}}
        '400': {$ref: '#/components/responses/AuthError'}
        '401': {$ref: '#/components/responses/AuthError'}
        '403': {$ref: '#/components/responses/AuthError'}
        '422': {$ref: '#/components/responses/AuthError'}
        '429': {$ref: '#/components/responses/AuthError'}
        '500': {$ref: '#/components/responses/AuthError'}
  /auth/v1/verify:
    post:
      tags: [Auth]
      summary: Подтвердить email или код восстановления
      operationId: verifyAuthOtp
      description: В почтовом сценарии Android может получить токены через разрешённый redirect.
      security: [{PublishableKey: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AuthVerify'}}}}
      responses:
        '200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/AuthSession'}}}}
        '400': {$ref: '#/components/responses/AuthError'}
        '401': {$ref: '#/components/responses/AuthError'}
        '403': {$ref: '#/components/responses/AuthError'}
        '422': {$ref: '#/components/responses/AuthError'}
        '429': {$ref: '#/components/responses/AuthError'}
        '500': {$ref: '#/components/responses/AuthError'}
  /auth/v1/token:
    post:
      tags: [Auth]
      summary: Войти по email и паролю или обменять токен сессии
      operationId: exchangeAuthToken
      description: PKCE применяется при обмене кода из почтового потока Supabase Auth. Поля тела зависят от grant_type.
      security: [{PublishableKey: []}]
      parameters:
      - {in: query, name: grant_type, required: true, schema: {type: string, enum: [password, refresh_token, pkce]}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AuthTokenRequest'}}}}
      responses:
        '200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/AuthSession'}}}}
        '400': {$ref: '#/components/responses/AuthError'}
        '401': {$ref: '#/components/responses/AuthError'}
        '403': {$ref: '#/components/responses/AuthError'}
        '422': {$ref: '#/components/responses/AuthError'}
        '429': {$ref: '#/components/responses/AuthError'}
        '500': {$ref: '#/components/responses/AuthError'}
  /auth/v1/logout:
    post:
      tags: [Auth]
      summary: Завершить сессию Supabase Auth
      operationId: logout
      description: После завершения локальный клиент удаляет сохранённые токены.
      security: [{PublishableKey: [], UserJwt: []}]
      parameters:
      - {in: query, name: scope, schema: {type: string, enum: [global, local, others], default: global}}
      responses:
        '204': {description: Сессия завершена}
        '400': {$ref: '#/components/responses/AuthError'}
        '401': {$ref: '#/components/responses/AuthError'}
        '403': {$ref: '#/components/responses/AuthError'}
        '422': {$ref: '#/components/responses/AuthError'}
        '429': {$ref: '#/components/responses/AuthError'}
        '500': {$ref: '#/components/responses/AuthError'}
  /auth/v1/user:
    get:
      tags: [Auth]
      summary: Получить данные собственной учётной записи Auth
      operationId: getAuthUser
      security: [{PublishableKey: [], UserJwt: []}]
      responses:
        '200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/AuthUser'}}}}
        '401': {$ref: '#/components/responses/AuthError'}
        '403': {$ref: '#/components/responses/AuthError'}
    put:
      tags: [Auth]
      summary: Задать пароль в сессии восстановления
      operationId: updateAuthPassword
      security: [{PublishableKey: [], UserJwt: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AuthNewPassword'}}}}
      responses:
        '200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/AuthUser'}}}}
        '401': {$ref: '#/components/responses/AuthError'}
        '422': {$ref: '#/components/responses/AuthError'}
  /storage/v1/object/soundscape-media/{objectPath}:
    parameters:
    - {in: path, name: objectPath, required: true, schema: {type: string}, description: 'Путь с сегментами users/<uid>/<filename>; редакторы используют editorial/<filename>.'}
    post:
      tags: [Sharing]
      summary: Загрузить изображение в закрытый bucket
      description: JPEG, PNG и WebP до 10485760 байт. Для замены загружается файл с новым именем и меняется ссылка объекта.
      operationId: uploadMedia
      security: [{PublishableKey: [], UserJwt: []}]
      requestBody:
        required: true
        content:
          image/jpeg: {schema: {type: string, format: binary}}
          image/png: {schema: {type: string, format: binary}}
          image/webp: {schema: {type: string, format: binary}}
      responses:
        '200': {description: Файл загружен, content: {application/json: {schema: {type: object, properties: {Key: {type: string}}}}}}
        '400': {description: 'Ошибка пути, MIME или файл уже существует'}
        '401': {description: Сессия отсутствует или недействительна}
        '403': {description: Недостаточно прав}
        '413': {description: Превышен размер}
    delete:
      tags: [Sharing]
      summary: Удалить собственную незакреплённую загрузку
      description: Для уже привязанного изображения сначала измените родительский объект и используйте действие CLEANUP.
      operationId: deleteUnattachedMedia
      security: [{PublishableKey: [], UserJwt: []}]
      responses:
        '200': {description: Storage обработал запрос}
        '401': {description: Сессия отсутствует или недействительна}
        '403': {description: Недостаточно прав}
        '404': {description: Объект недоступен}
  /rest/v1/rpc/get_visible_places:
    post:
      tags: [Geography]
      summary: Места в видимом прямоугольнике карты
      operationId: getVisiblePlaces
      description: Публичные редакционные города и опубликованные PUBLIC-отметки. Личная PRIVATE-отметка доступна только владельцу при JWT. UNLISTED исключены из обзора. При minLon > maxLon учитывается пересечение антимеридиана.
      security: [{PublishableKey: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VisiblePlacesRequest'}}}}
      responses:
        '200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/PlacePage'}}}}
        '400': {$ref: '#/components/responses/RpcError'}
        '401': {$ref: '#/components/responses/RpcError'}
        '403': {$ref: '#/components/responses/RpcError'}
        '429': {$ref: '#/components/responses/RpcError'}
        '500': {$ref: '#/components/responses/RpcError'}
  /rest/v1/rpc/get_nearby_places:
    post:
      tags: [Geography]
      summary: Найти публичные места поблизости
      operationId: getNearbyPlaces
      description: ST_DWithin с PostGIS geography; координаты передаются по пользовательскому действию, не записываются как история местоположения.
      security: [{PublishableKey: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NearbyPlacesRequest'}}}}
      responses:
        '200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/PlacePage'}}}}
        '400': {$ref: '#/components/responses/RpcError'}
        '401': {$ref: '#/components/responses/RpcError'}
        '403': {$ref: '#/components/responses/RpcError'}
        '429': {$ref: '#/components/responses/RpcError'}
        '500': {$ref: '#/components/responses/RpcError'}
  /rest/v1/rpc/list_playlists:
    post:
      tags: [Playlists]
      summary: Получить публичные или собственные плейлисты
      operationId: listPlaylists
      description: Для MINE необходим JWT. PUBLIC возвращает только опубликованные публичные подборки, UNLISTED не индексируются.
      security: [{PublishableKey: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ListPlaylistsRequest'}}}}
      responses:
        '200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/PlaylistPage'}}}}
        '400': {$ref: '#/components/responses/RpcError'}
        '401': {$ref: '#/components/responses/RpcError'}
        '403': {$ref: '#/components/responses/RpcError'}
        '429': {$ref: '#/components/responses/RpcError'}
        '500': {$ref: '#/components/responses/RpcError'}
  /rest/v1/rpc/get_playlist:
    post:
      tags: [Playlists]
      summary: Получить разрешённый плейлист по ID
      operationId: getPlaylist
      description: Только PUBLIC или владелец (JWT); UNLISTED открываются по отдельному токенизированному маршруту.
      security: [{PublishableKey: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GetPlaylistRequest'}}}}
      responses:
        '200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/PlaylistDetail'}}}}
        '400': {$ref: '#/components/responses/RpcError'}
        '401': {$ref: '#/components/responses/RpcError'}
        '403': {$ref: '#/components/responses/RpcError'}
        '404': {$ref: '#/components/responses/RpcError'}
        '500': {$ref: '#/components/responses/RpcError'}
  /rest/v1/rpc/save_playlist:
    post:
      tags: [Playlists]
      summary: Создать или изменить собственный плейлист
      operationId: savePlaylist
      description: Атомарно сохраняет плейлист и упорядоченный состав. Редакторские опубликованные подборки не изменяются этой пользовательской RPC. Для обновления обязателен expectedRevision, несовпадение → 409.
      security: [{PublishableKey: [], UserJwt: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SavePlaylistRequest'}}}}
      responses:
        '200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/PlaylistDetail'}}}}
        '400': {$ref: '#/components/responses/RpcError'}
        '401': {$ref: '#/components/responses/RpcError'}
        '403': {$ref: '#/components/responses/RpcError'}
        '404': {$ref: '#/components/responses/RpcError'}
        '409': {$ref: '#/components/responses/RpcError'}
        '422': {$ref: '#/components/responses/RpcError'}
        '500': {$ref: '#/components/responses/RpcError'}
  /rest/v1/rpc/delete_playlist:
    post:
      tags: [Playlists]
      summary: Удалить собственный плейлист
      operationId: deletePlaylist
      description: Только владелец, проверка версии; редакционные плейлисты защищены от удаления обычным пользователем.
      security: [{PublishableKey: [], UserJwt: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DeleteObjectRequest'}}}}
      responses:
        '200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/ActionResult'}}}}
        '400': {$ref: '#/components/responses/RpcError'}
        '401': {$ref: '#/components/responses/RpcError'}
        '403': {$ref: '#/components/responses/RpcError'}
        '404': {$ref: '#/components/responses/RpcError'}
