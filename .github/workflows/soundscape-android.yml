name: SoundScape / Android

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soundscape-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  domain-jvm:
    runs-on: ubuntu-24.04
    container: eclipse-temurin:25-jdk
    timeout-minutes: 15
    defaults:
      run:
        working-directory: SoundScapeApp
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@v4.4.2
      - name: Build Domain without Android SDK
        run: |
          test ! -f local.properties
          unset ANDROID_HOME ANDROID_SDK_ROOT
          sh ./gradlew -PdomainOnly=true :core:domain:build :core:domain:dependencies --no-daemon

  android-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: SoundScapeApp
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4.4.2
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install required SDK Platform
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Build debug APK
        run: sh ./gradlew :app:assembleDebug --no-daemon
      - name: Verify exported Room schema
        run: git diff --exit-code -- core/database/schemas
      - name: Unit tests
        run: sh ./gradlew :core:database:testDebugUnitTest :app:testDebugUnitTest :presentation:testDebugUnitTest :core:network:testDebugUnitTest :core:data:testDebugUnitTest --no-daemon
      - name: Detekt
        run: sh ./gradlew detekt --no-daemon
      - name: Android Lint
        run: sh ./gradlew :core:database:lintDebug :app:lintDebug :core:data:lintDebug :core:network:lintDebug :presentation:lintDebug --no-daemon
      - name: Release build and debug-only isolation
        run: |
          sh ./gradlew :app:assembleRelease --no-daemon
          python3 - <<'PYCODE'
          import glob
          import zipfile
          marker = b'NetworkDiagnosticsActivity'
          for variant in ('debug', 'release'):
              files = glob.glob(f'app/build/outputs/apk/{variant}/*.apk')
              assert files, f'Missing {variant} APK'
              for path in files:
                  with zipfile.ZipFile(path) as apk:
                      present = any(marker in apk.read(n) for n in apk.namelist() if n.endswith('.dex'))
                      assert present == (variant == 'debug'), path
          PYCODE
      - name: Direct HTTP dependency audit
        run: |
          sh ./gradlew :app:dependencies --configuration debugRuntimeClasspath --no-daemon > debug-dependencies.txt
          sh ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon > release-dependencies.txt
          if grep -Ei 'supabase|io\.ktor|org\.postgresql|FAILED' debug-dependencies.txt release-dependencies.txt; then
            exit 1
          fi
      - name: Diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: android-reports
          path: |
            SoundScapeApp/**/build/reports/
            SoundScapeApp/**/build/test-results/
          if-no-files-found: ignore
      - name: Debug APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: soundscape-debug
          path: SoundScapeApp/app/build/outputs/apk/debug/*.apk

  room-instrumented:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4.4.2
      - uses: android-actions/setup-android@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: cd SoundScapeApp && sh ./gradlew :core:database:connectedDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: room-instrumented-reports
          path: SoundScapeApp/core/database/build/reports/androidTests/
