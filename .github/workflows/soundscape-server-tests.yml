# SoundScape practice 11 — LOCAL CI only.
# The workflow is a local draft. It never links to or deploys to the hosted Supabase project.
name: SoundScape / Server tests

on:
  workflow_dispatch:
  push:
    branches: [feat/backend]
    paths:
      - '.github/workflows/soundscape-server-tests.yml'
      - 'backend/supabase/**'
      - 'backend/tests/postman/**'
  pull_request:
    paths:
      - '.github/workflows/soundscape-server-tests.yml'
      - 'backend/supabase/**'
      - 'backend/tests/postman/**'

permissions:
  contents: read

concurrency:
  group: soundscape-server-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deno-unit:
    name: Deno unit / 36 assertions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.8'

      - name: Run Deno unit tests
        run: deno test ./supabase/tests/unit/

  local-db-api:
    name: Local PostgreSQL (pgTAP) and negative API
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Check test inputs
        run: |
          test -f supabase/config.toml
          test -f supabase/tests/database/01_schema_security_test.sql
          test -f supabase/tests/database/02_rls_visibility_test.sql
          test -f supabase/tests/database/03_constraints_test.sql
          test -f tests/postman/SoundScape_Practice11_Negative_Local.postman_collection.json

      - name: Start local Supabase (isolated Docker stack)
        run: supabase start

      - name: Run pgTAP (52 assertions)
        run: supabase test db

      - name: Install Newman
        run: npm install --global newman@6

      - name: Run negative API checks (24 requests, 48 assertions)
        run: |
          set -euo pipefail

          # Supabase CLI exports LOCAL credentials; never take secrets from GitHub.
          local_key="$(supabase status -o env | sed -n 's/^ANON_KEY=//p' | tail -n 1)"
          local_key="${local_key%\"}"
          local_key="${local_key#\"}"
          if [[ -z "${local_key}" ]]; then
            echo 'Local ANON_KEY was not provided by Supabase CLI' >&2
            exit 1
          fi
          echo "::add-mask::${local_key}"

          # Explicitly serve functions. The project sets verify_jwt=false and
          # performs its own apikey + user JWT checks in _shared/core.ts.
          supabase functions serve --no-verify-jwt > "${RUNNER_TEMP}/soundscape-edge.log" 2>&1 &
          edge_pid=$!
          trap 'kill "${edge_pid}" 2>/dev/null || true' EXIT

          # Probe the actual application handler, not just the HTTP gateway.
          # A valid local key + missing query must yield the intentional 400.
          ready=0
          for attempt in $(seq 1 45); do
            status="$(curl -sS --max-time 6 -o /dev/null -w '%{http_code}' \
              -X POST 'http://127.0.0.1:54321/functions/v1/v1-search' \
              -H "apikey: ${local_key}" \
              -H 'Content-Type: application/json' \
              --data '{}' || true)"
            if [[ "${status}" == '400' ]]; then
              ready=1
              break
            fi
            sleep 2
          done
          if [[ "${ready}" != 1 ]]; then
            echo 'Edge Function did not become ready with expected HTTP 400' >&2
            tail -n 80 "${RUNNER_TEMP}/soundscape-edge.log" >&2 || true
            exit 1
          fi

          newman run 'tests/postman/SoundScape_Practice11_Negative_Local.postman_collection.json' \
            --env-var 'baseUrl=http://127.0.0.1:54321' \
            --env-var "publishableKey=${local_key}" \
            --reporters cli,json \
            --reporter-json-export "${RUNNER_TEMP}/soundscape-newman-results.json"

          # A zero exit status is not sufficient if requests were skipped.
          python3 - "${RUNNER_TEMP}/soundscape-newman-results.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          run = report['run']
          executions = run.get('executions', [])
          completed = sum(1 for result in executions if result.get('response') is not None)
          assertions = run['stats']['assertions']
          total_assertions = assertions['total']
          failed_assertions = assertions['failed']
          print(f'Executed responses: {completed}/24; assertions: {total_assertions}/48; failed: {failed_assertions}')
          if completed != 24 or total_assertions != 48 or failed_assertions != 0:
              raise SystemExit('CI validation failed: missing/skipped requests or failed assertions')
          PY

      - name: Report local Edge logs when test job fails
        if: failure()
        run: |
          if [[ -f "${RUNNER_TEMP}/soundscape-edge.log" ]]; then
            tail -n 100 "${RUNNER_TEMP}/soundscape-edge.log"
          fi
