# Uses the disposable Supabase stack created on the runner.
name: SoundScape / Server tests

on:
  workflow_dispatch:
  push:
    branches: [feat/backend, feature/ui-realisation, develop, main]
    paths:
      - '.github/workflows/soundscape-server-tests.yml'
      - 'backend/supabase/**'
      - 'backend/tests/postman/**'
      - 'backend/scripts/**'
      - 'backend/openapi.yaml'
  pull_request:
    paths:
      - '.github/workflows/soundscape-server-tests.yml'
      - 'backend/supabase/**'
      - 'backend/tests/postman/**'
      - 'backend/scripts/**'
      - 'backend/openapi.yaml'

permissions:
  contents: read

concurrency:
  group: soundscape-server-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deno-unit:
    name: Deno unit and type checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.8'

      - name: Run Deno unit tests
        run: deno test --allow-env=AUDIUS_API_KEY,AUDIUS_CONTENT_HOSTS ./supabase/tests/unit/

      - name: Type-check Edge Functions and importer
        run: deno check ./supabase/functions/*/index.ts ./scripts/*.ts ./supabase/tests/integration/

      - name: Set up Python for OpenAPI validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate OpenAPI
        run: |
          python -m pip install 'openapi-spec-validator==0.7.2'
          python -m openapi_spec_validator openapi.yaml

  local-db-api:
    name: Local PostgreSQL (pgTAP) and negative API
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.8'

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.0.0

      - name: Check test inputs
        run: |
          test -f supabase/config.toml
          test -f supabase/tests/database/01_schema_security_test.sql
          test -f supabase/tests/database/02_rls_visibility_test.sql
          test -f supabase/tests/database/03_constraints_test.sql
          test -f supabase/tests/database/04_audius_catalog_test.sql
          test -f supabase/tests/database/08_be02_contracts_test.sql
          test -f supabase/tests/database/09_be02_close_test.sql
          test -f supabase/tests/integration/be02_http_test.ts
          test -f tests/postman/SoundScape_Practice11_Negative_Local.postman_collection.json

      - name: Start local Supabase (isolated Docker stack)
        run: supabase start > "${RUNNER_TEMP}/soundscape-supabase-start.log" 2>&1

      - name: Verify all migrations applied on the clean database
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(supabase/migrations/*.sql)
          test "${#files[@]}" -ge 18
          expected="$(printf '%s\n' "${files[@]##*/}" | cut -d_ -f1 | LC_ALL=C sort)"
          applied="$(docker exec supabase_db_backend psql -XAt -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c 'select version from supabase_migrations.schema_migrations order by version')"
          diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$applied")
          echo "Applied ${#files[@]} local migrations"

      - name: Run pgTAP
        run: supabase test db

      - name: Run Edge handler integration tests with controlled providers
        run: |
          set -euo pipefail
          docker exec supabase_db_backend psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c \
            'INSERT INTO internal.audius_budget(requests_per_second,requests_per_month) VALUES (100,1000000)'
          local_status="$(supabase status -o env)"
          local_value() {
            printf '%s\n' "$local_status" | sed -n "s/^$1=//p" | tr -d '"' | tail -n 1
          }
          test "$(local_value API_URL)" = 'http://127.0.0.1:54321'
          export STAB_LOCAL_PORT=54321
          export STAB_LOCAL_ANON_KEY="$(local_value ANON_KEY)"
          export STAB_LOCAL_SERVICE_KEY="$(local_value SERVICE_ROLE_KEY)"
          export STAB_LOCAL_SECRET_KEY="$(local_value SECRET_KEY)"
          export BE02_LOCAL_PORT=54321
          export BE02_LOCAL_MAIL_PORT=54324
          export BE02_LOCAL_ANON_KEY="$STAB_LOCAL_ANON_KEY"
          export BE02_LOCAL_SERVICE_KEY="$STAB_LOCAL_SERVICE_KEY"
          export BE02_LOCAL_JWT_SECRET="$(local_value JWT_SECRET)"
          for value in "$STAB_LOCAL_ANON_KEY" "$STAB_LOCAL_SERVICE_KEY" "$STAB_LOCAL_SECRET_KEY" "$BE02_LOCAL_JWT_SECRET"; do
            test -n "$value"
            echo "::add-mask::$value"
          done
          deno test --junit-path="${RUNNER_TEMP}/soundscape-deno-integration.xml" \
            --allow-net=127.0.0.1:54321,127.0.0.1:54324 \
            --allow-env=STAB_LOCAL_PORT,STAB_LOCAL_ANON_KEY,STAB_LOCAL_SERVICE_KEY,STAB_LOCAL_SECRET_KEY,BE02_LOCAL_PORT,BE02_LOCAL_MAIL_PORT,BE02_LOCAL_ANON_KEY,BE02_LOCAL_SERVICE_KEY,BE02_LOCAL_JWT_SECRET,SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,SUPABASE_PUBLISHABLE_KEYS,SUPABASE_SECRET_KEY,SUPABASE_SECRET_KEYS,SUPABASE_ANON_KEY,SUPABASE_SERVICE_ROLE_KEY,AUDIUS_API_KEY,AUDIUS_CONTENT_HOSTS,AUDIUS_OPERATION_PARALLEL,AUDIUS_OPERATION_UPDATES,GIGACHAT_AUTH_KEY,GIGACHAT_SCOPE,GIGACHAT_MODEL \
            ./supabase/tests/integration/
          python3 - "${RUNNER_TEMP}/soundscape-deno-integration.xml" <<'PY'
          import sys
          from xml.etree import ElementTree

          cases = ElementTree.parse(sys.argv[1]).findall('.//testcase')
          if len(cases) < 6 or any(case.find('skipped') is not None for case in cases):
              raise SystemExit('Expected at least six integration tests with no skips')
          print(f'Executed {len(cases)} integration tests')
          PY

          docker exec supabase_db_backend psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c \
            "UPDATE internal.audius_budget SET requests_per_second=6, recent='{}', month_count=0"
          export SUPABASE_URL=http://127.0.0.1:54321
          export SUPABASE_PUBLISHABLE_KEY="$STAB_LOCAL_ANON_KEY"
          export SUPABASE_SECRET_KEY="$STAB_LOCAL_SECRET_KEY"
          deno run --allow-run=deno --allow-net=127.0.0.1:54321 \
            --allow-env=SUPABASE_URL,SUPABASE_PUBLISHABLE_KEYS,SUPABASE_PUBLISHABLE_KEY,SUPABASE_ANON_KEY,SUPABASE_SECRET_KEYS,SUPABASE_SECRET_KEY,SUPABASE_SERVICE_ROLE_KEY \
            ./scripts/test-audius-workers.ts

      - name: Install Newman
        run: npm install --global newman@6

      - name: Run negative API checks (24 requests, 48 assertions)
        run: |
          set -euo pipefail

          # Supabase CLI exports LOCAL credentials; never take secrets from GitHub.
          local_key="$(supabase status -o env | sed -n 's/^ANON_KEY=//p' | tail -n 1)"
          local_key="${local_key%\"}"
          local_key="${local_key#\"}"
          if [[ -z "${local_key}" ]]; then
            echo 'Local ANON_KEY was not provided by Supabase CLI' >&2
            exit 1
          fi
          echo "::add-mask::${local_key}"

          # 'supabase start' already serves Edge Functions. Do NOT run
          # 'supabase functions serve' a second time: restarting the runtime
          # while Newman is running can cause transient Kong 502 responses.
          #
          # Warm up each local handler and require the exact expected status.
          # These invalid requests fail before any DB write or provider call.
          check_edge() {
            local slug="$1"
            local payload="$2"
            local expected="$3"
            local actual
            for attempt in $(seq 1 30); do
              actual="$(curl -sS --max-time 6 -o /dev/null -w '%{http_code}' \
                -X POST "http://127.0.0.1:54321/functions/v1/${slug}" \
                -H "apikey: ${local_key}" \
                -H 'Content-Type: application/json' \
                --data "${payload}" || true)"
              if [[ "${actual}" == "${expected}" ]]; then
                echo "Edge ready: ${slug} (${actual})"
                return 0
              fi
              sleep 2
            done
            echo "Edge not ready: ${slug}; expected ${expected}, got ${actual}" >&2
            return 1
          }

          check_edge v1-search '{}' 400
          check_edge v1-search-tracks '{}' 400
          check_edge v1-resolve-track '{"trackId":"invalid-uuid"}' 400
          check_edge v1-generate-playlist '{}' 401
          check_edge v1-open-share '{"token":"short"}' 400
          check_edge v1-manage-share '{}' 401
          check_edge v1-media '{"objectType":"INVALID"}' 400
          check_edge v1-delete-account '{"confirm":true}' 401

          newman run 'tests/postman/SoundScape_Practice11_Negative_Local.postman_collection.json' \
            --env-var 'baseUrl=http://127.0.0.1:54321' \
            --env-var "publishableKey=${local_key}" \
            --reporters cli,json \
            --reporter-json-export "${RUNNER_TEMP}/soundscape-newman-results.json"

          # A zero exit status is not sufficient if requests were skipped.
          python3 - "${RUNNER_TEMP}/soundscape-newman-results.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          run = report['run']
          executions = run.get('executions', [])
          completed = sum(1 for result in executions if result.get('response') is not None)
          assertions = run['stats']['assertions']
          total_assertions = assertions['total']
          failed_assertions = assertions['failed']
          print(f'Executed responses: {completed}/24; assertions: {total_assertions}/48; failed: {failed_assertions}')
          if completed != 24 or total_assertions != 48 or failed_assertions != 0:
              raise SystemExit('CI validation failed: missing/skipped requests or failed assertions')
          PY

      - name: Report local Edge logs when test job fails
        if: failure()
        run: |
          if docker inspect supabase_edge_runtime_backend >/dev/null 2>&1; then
            docker logs --tail 100 supabase_edge_runtime_backend || true
          else
            echo 'Local Edge Runtime container not found.'
          fi
